<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>引力目录 · Gravity Explorer</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/preload.js"></script>
</head>
<body>
  <div class="gv-shell">
    <header class="gv-header">
      <div class="gv-ws-info" id="gv-ws-box" title="当前工作区">
        <span class="gv-ws-icon" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24">
            <defs>
              <linearGradient id="gvHdrFld" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#66c8ff" />
                <stop offset="100%" stop-color="#1e88e5" />
              </linearGradient>
            </defs>
            <path d="M2.5 6.5C2.5 5.12 3.62 4 5 4h4.2c.65 0 1.26.31 1.64.84l1.02 1.41c.19.26.49.42.81.42H19c1.38 0 2.5 1.12 2.5 2.5v8.33c0 1.38-1.12 2.5-2.5 2.5H5c-1.38 0-2.5-1.12-2.5-2.5V6.5z" fill="url(#gvHdrFld)" />
          </svg>
        </span>
        <div class="gv-ws-texts">
          <span id="gv-ws-name" class="gv-ws-title">加载中...</span>
          <span id="gv-ws-path" class="gv-ws-sub"></span>
        </div>
      </div>
      <div class="gv-hdr-actions">
        <button id="gv-btn-reveal-root" class="gv-icon-btn" title="在访达 / 资源管理器中显示">↗</button>
        <button id="gv-btn-switch-root" class="gv-icon-btn" title="切换工作目录">📁</button>
        <button id="gv-btn-hidden" class="gv-icon-btn" title="显示 / 隐藏点文件">👁</button>
        <button id="gv-btn-collapse" class="gv-icon-btn" title="全部折叠">⊟</button>
        <button id="gv-btn-refresh" class="gv-icon-btn" title="刷新目录">↻</button>
      </div>
    </header>

    <div id="gv-path-bar" class="gv-path-input-bar" hidden>
      <input type="text" id="gv-manual-path" placeholder="输入目录绝对路径..." />
      <button id="gv-btn-apply-path" class="gv-btn primary">切换</button>
      <button id="gv-btn-cancel-path" class="gv-icon-btn" title="取消">✕</button>
    </div>

    <div class="gv-search-bar">
      <input type="text" id="gv-search-input" placeholder="搜索文件名或相对路径..." autocomplete="off" />
      <button id="gv-btn-clear-search" class="gv-clear-btn" title="清空" hidden>×</button>
    </div>

    <div class="gv-col-head">
      <span class="col-name">名称</span>
      <span class="col-date">修改日期</span>
      <span class="col-size">大小</span>
      <span class="col-kind">种类</span>
    </div>

    <main id="gv-tree-viewport" class="gv-tree-viewport">
      <div id="gv-tree-container" class="gv-tree-container">
        <div class="gv-empty">正在读取项目目录...</div>
      </div>
    </main>

    <footer class="gv-footer">
      <div id="gv-breadcrumb" class="gv-breadcrumb"></div>
      <div id="gv-status-count" class="gv-status-count">0 个项目</div>
    </footer>

    <div id="gv-resizer" class="gv-resizer" hidden></div>

    <section id="gv-preview-drawer" class="gv-preview-drawer" hidden>
      <div class="gv-drawer-head">
        <div class="gv-drawer-title-group">
          <span id="gv-prev-name" class="gv-drawer-title">预览</span>
          <span id="gv-prev-meta" class="gv-drawer-meta"></span>
        </div>
        <div class="gv-drawer-actions">
          <button id="gv-prev-copy-at" class="gv-mini-btn" title="复制 @相对路径 引用">@引用</button>
          <button id="gv-prev-open-tab" class="gv-mini-btn primary" title="在主标签页打开">↗ 主标签</button>
          <button id="gv-prev-close" class="gv-icon-btn" title="关闭预览">✕</button>
        </div>
      </div>
      <div id="gv-prev-body" class="gv-drawer-body"></div>
    </section>

    <div id="gv-context-menu" class="gv-ctx-menu" hidden></div>

    <div id="gv-trash-modal" class="gv-modal-overlay" hidden>
      <div class="gv-modal-box">
        <div class="gv-modal-title">移至废纸篓 / 回收站</div>
        <div class="gv-modal-desc">确定要将 <b id="gv-trash-name"></b> 移至系统废纸篓吗？</div>
        <div class="gv-modal-foot">
          <button id="gv-trash-cancel" class="gv-btn">取消</button>
          <button id="gv-trash-confirm" class="gv-btn danger">确认移除</button>
        </div>
      </div>
    </div>

    <div id="gv-toast" class="gv-toast" hidden></div>
  </div>
  <script src="/preview.js"></script>
  <script src="/app.js"></script>
</body>
</html>
