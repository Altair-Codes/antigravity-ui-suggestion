<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目文件浏览器</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/preload.js"></script>
</head>
<body>
  <div class="app-layout">
    <!-- macOS Finder Style Top Toolbar -->
    <header class="panel-header">
      <div class="workspace-info" id="workspace-info-box" title="当前工作区目录">
        <span class="folder-badge" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <defs>
              <linearGradient id="finderHdrFolder" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#66c8ff"/>
                <stop offset="100%" stop-color="#1e88e5"/>
              </linearGradient>
            </defs>
            <path d="M2.5 6.5C2.5 5.12 3.62 4 5 4h4.2c.65 0 1.26.31 1.64.84l1.02 1.41c.19.26.49.42.81.42H19c1.38 0 2.5 1.12 2.5 2.5v8.33c0 1.38-1.12 2.5-2.5 2.5H5c-1.38 0-2.5-1.12-2.5-2.5V6.5z" fill="url(#finderHdrFolder)"/>
          </svg>
        </span>
        <div class="workspace-text-group">
          <span id="workspace-name" class="workspace-title">加载中...</span>
          <span id="workspace-path" class="workspace-subtitle"></span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-reveal-root" class="icon-btn" title="在访达 (Finder) 中打开">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
        <button id="btn-change-path" class="icon-btn" title="切换目录路径">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
            <path d="M2 10h20"></path>
          </svg>
        </button>
        <button id="btn-toggle-hidden" class="icon-btn" title="显示 / 隐藏点文件">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
        <button id="btn-refresh" class="icon-btn" title="刷新列表">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Path Input Overlay -->
    <div id="path-input-bar" class="path-input-bar" hidden>
      <input type="text" id="manual-path-input" placeholder="输入目录绝对路径（如 /Users/username/Documents/...）" />
      <button id="btn-apply-path" class="btn btn-primary">切换</button>
      <button id="btn-cancel-path" class="icon-btn" title="取消">✕</button>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
      <span class="search-icon" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input type="text" id="search-input" placeholder="搜索名称或路径..." autocomplete="off" />
      <button id="btn-clear-search" class="clear-btn" title="清除搜索" hidden>×</button>
    </div>

    <!-- macOS Finder Column Header Bar -->
    <div class="finder-col-header">
      <div class="col-name">名称 <span class="sort-caret">⌃</span></div>
      <div class="col-date">修改日期</div>
      <div class="col-size">大小</div>
      <div class="col-kind">种类</div>
    </div>

    <!-- Tree View -->
    <main class="tree-viewport" id="tree-viewport">
      <div id="tree-container" class="tree-container">
        <div class="loading-state">正在扫描项目目录...</div>
      </div>
    </main>

    <!-- macOS Finder Path Bar & Status Bar -->
    <footer class="finder-footer">
      <div id="finder-path-bar" class="finder-path-bar" title="点击在访达中显示"></div>
      <div id="finder-status-bar" class="finder-status-bar">0 个项目</div>
    </footer>

    <!-- Resizer Splitter Bar -->
    <div id="preview-resizer" class="preview-resizer" hidden></div>

    <!-- File Preview Drawer -->
    <div id="preview-drawer" class="preview-drawer" hidden>
      <div class="drawer-header">
        <div class="drawer-title-group">
          <span id="preview-icon" class="preview-icon-wrap"></span>
          <span id="preview-title" class="drawer-title">文件预览</span>
          <span id="preview-size" class="drawer-size"></span>
        </div>
        <div class="drawer-actions">
          <div id="preview-custom-actions" class="preview-custom-actions"></div>
          <button id="btn-copy-mention" class="icon-btn" title="复制 @引用 到剪贴板">@</button>
          <button id="btn-open-tab" class="icon-btn" title="在 Antigravity 主标签页打开">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </button>
          <button id="btn-send-agent" class="btn btn-primary" title="发送至对话提问">提问</button>
          <button id="btn-close-preview" class="icon-btn" title="关闭预览">✕</button>
        </div>
      </div>
      <div class="drawer-body" id="preview-body"></div>

      <!-- Floating Selection Quote Bubble -->
      <div id="selection-quote-bubble" class="selection-quote-bubble" hidden>
        <button id="btn-quote-copy" class="btn-bubble-action" title="复制引用片段，在输入框按 Cmd+V 粘贴">
          复制引用片段
        </button>
        <button id="btn-quote-send" class="btn-bubble-action btn-bubble-secondary" title="向 Agent 提问">
          提问
        </button>
      </div>

      <!-- Direct Send Message Input Popover -->
      <div id="annot-send-popover" class="annot-send-popover" hidden>
        <div class="popover-header">
          <span class="popover-title">附带说明发送给 Agent</span>
          <button class="icon-btn" id="btn-popover-close" title="关闭 (Esc)">✕</button>
        </div>
        <div class="popover-body">
          <textarea id="annot-prompt-input" rows="3" placeholder="输入想对 AI Agent 说的话（Enter 发送，Shift+Enter 换行）..."></textarea>
        </div>
        <div class="popover-footer">
          <span class="popover-hint">Enter 发送 · Esc 取消</span>
          <button class="btn btn-secondary" id="btn-popover-cancel">取消</button>
          <button class="btn btn-primary" id="btn-popover-submit">发送</button>
        </div>
      </div>
    </div>

    <!-- Trash Confirmation Modal -->
    <div id="delete-confirm-modal" class="confirm-modal-overlay" hidden>
      <div class="confirm-modal-box">
        <div class="confirm-modal-header">
          <span class="confirm-modal-title">移至废纸篓</span>
        </div>
        <div class="confirm-modal-body">
          确定要将 <b id="delete-confirm-target" style="color:var(--text-primary); word-break:break-all;"></b> 移至系统废纸篓吗？
          <div style="font-size:11.5px; color:var(--text-muted); margin-top:8px; line-height:1.4;">
            文件不会被永久抹除，可随时从系统废纸篓还原。
          </div>
        </div>
        <div class="confirm-modal-footer">
          <button id="btn-delete-cancel" class="btn btn-secondary">取消</button>
          <button id="btn-delete-confirm" class="btn btn-danger">移至废纸篓</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="/highlight.min.js"></script>
  <script src="/pele.global.js"></script>
  <script src="/pdf.min.js"></script>
  <script src="/previewers.js?v=2.1.0"></script>
  <script src="/app.js?v=2.1.0"></script>
</body>
</html>
